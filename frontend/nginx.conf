server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path nginx doesn't recognize
    # as a real file must still fall back to index.html, or refreshing on a
    # route like /dashboard/students would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
