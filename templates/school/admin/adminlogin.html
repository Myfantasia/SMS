<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MyFantasia</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}">
    <link rel="stylesheet" href="{% static 'css/success_popup.css' %}">
</head>
<body>

    {% include "school/navbar.html" %}
    {% include "school/success_popup.html" %}

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-shield" style="font-size: 3.5rem; color: #6366f1; margin-bottom: 15px;"></i>
                <h2>Admin Portal</h2>
                <p>Secure Access Gateway</p>
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                </div>

                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-login">Login</button>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <div class="extra-links">
                    <a href="{% url 'password_reset' %}" class="forgot-password">Forgot Password?</a>
                    <span class="signup-link">New? <a href="/adminsignup">Sign Up</a></span>
                </div>
            </form>
        </div>
    </div>

    {% include "school/footer.html" %}

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script src="{% static 'js/admin_login.js' %}"></script>
<script src="{% static 'js/success_popup.js' %}"></script>
</body>
</html>
