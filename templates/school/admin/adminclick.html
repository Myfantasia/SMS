<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | MyFantasia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=3">
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}?v=4">
</head>
<body class="role-admin">

    {% include "school/navbar.html" %}

    <div class="login-wrapper">
        <div class="login-card" style="text-align: center;">
            <div class="login-header">
                <div class="header-icon-badge"><i class="fas fa-user-cog"></i></div>
                <h2>Admin Gateway</h2>
                <p>Manage the entire school ecosystem from here.</p>
            </div>

            <a href="/adminsignup" class="click-btn btn-primary-ghost">
                <i class="fas fa-user-plus"></i> Register New Admin
            </a>

            <a href="/adminlogin" class="click-btn btn-login">
                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
            </a>

            <div class="signup-link" style="margin-top: 30px;">
                <p>Not an Admin? <a href="/">Return Home</a></p>
            </div>
        </div>
    </div>

    {% include "school/footer.html" %}

</body>
</html>
