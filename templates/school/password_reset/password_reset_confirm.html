<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password | MyFantasia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}">
</head>
<body>
    {% include "school/navbar.html" %}

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-key" style="font-size: 3rem; color: #818cf8; margin-bottom: 15px;"></i>
                <h2>Reset Password</h2>
                <p>Secure your account with a new password.</p>
            </div>

            <form method="post" id="resetForm">
                {% csrf_token %}

                <div class="form-group">
                    <label class="field-label">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="new_password1" id="pass1" class="form-control" placeholder="Enter new password" required>
                        <i class="fas fa-eye toggle-pass" data-target="pass1"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="new_password2" id="pass2" class="form-control" placeholder="Repeat password" required>
                        <i class="fas fa-eye toggle-pass" data-target="pass2"></i>
                    </div>
                    <p id="matchError" style="color: #f87171; font-size: 0.85rem; display: none; margin-top: 5px;">
                        <i class="fas fa-times-circle"></i> Passwords do not match!
                    </p>
                </div>

                <button type="submit" class="btn-login">Change Password</button>
            </form>
        </div>
    </div>

    <script src="{% static 'js/password_reset.js' %}"></script>

    {% include "school/footer.html" %}
</body>
</html>
