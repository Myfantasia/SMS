<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sent | MyFantasia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}">
</head>
<body>
    {% include "school/navbar.html" %}

    <div class="login-wrapper">
        <div class="login-card" style="text-align: center;">
            <div class="login-header">
                <i class="fas fa-envelope-open-text" style="font-size: 3.5rem; color: #4ade80; margin-bottom: 20px;"></i>
                <h2>Check Your Email</h2>
                <p style="margin-bottom: 20px;">We have sent a password reset link to your email address.</p>
                <p style="font-size: 0.9rem; color: #64748b;">If you don't see it, check your spam folder or contact the IT Department.</p>
            </div>

            <a href="/" class="click-btn btn-primary-ghost" style="justify-content: center;">
                Return Home
            </a>
        </div>
    </div>
    {% include "school/footer.html" %}
</body>
</html>
