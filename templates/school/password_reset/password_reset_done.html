<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sent | MyFantasia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=3">
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}?v=4">
</head>
<body>
    {% include "school/navbar.html" %}

    <div class="login-wrapper">
        <div class="login-card" style="text-align: center;">
            <div class="login-header">
                <div class="header-icon-badge" style="background: rgba(74, 222, 128, 0.14); color: #16a34a;"><i class="fas fa-envelope-open-text"></i></div>
                <h2>Check Your Email</h2>
                <p style="margin-bottom: 20px;">We have sent a password reset link to your email address.</p>
                <p style="font-size: 0.9rem; color: var(--text-muted);">If you don't see it, check your spam folder or contact the IT Department.</p>
            </div>

            <a href="/" class="click-btn btn-primary-ghost" style="justify-content: center;">
                Return Home
            </a>
        </div>
    </div>
    {% include "school/footer.html" %}
</body>
</html>
