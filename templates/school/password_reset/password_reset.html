<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | MyFantasia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=3">
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}?v=4">
</head>
<body>
    {% include "school/navbar.html" %}

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="header-icon-badge"><i class="fas fa-lock-open"></i></div>
                <h2>Forgot Password?</h2>
                <p>Enter your registered school email to receive a reset link.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="field-label">Email Address</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" class="form-control" placeholder="e.g. kamau.james@student.myfantasia.com" required>
                    </div>
                </div>

                <button type="submit" class="btn-login"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
            </form>
             <div class="signup-link">
                <p>Remembered it? <a href="{{ login_url }}">Back to Login</a></p>
            </div>
        </div>
    </div>
    {% include "school/footer.html" %}
</body>
</html>
